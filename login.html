<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FS Shorthand Hub - Login & Signup</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 100%; max-width: 420px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #0056b3; }
        
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; color: #666; }
        .tab.active { color: #0056b3; border-bottom: 3px solid #0056b3; margin-bottom: -2px; }
        
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; box-sizing: border-box; }
        
        .password-container { position: relative; }
        .toggle-password { position: absolute; right: 12px; top: 14px; cursor: pointer; font-size: 14px; color: #007bff; user-select: none; font-weight: bold; }
        
        .btn { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .btn:hover { background-color: #004085; }
        
        .error-msg { color: #dc3545; font-size: 13px; margin-top: 5px; display: none; }
        .success-msg { color: #28a745; font-size: 13px; margin-top: 5px; display: none; }
        
        .form-section { display: none; }
        .form-section.active { display: block; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="text-align: center; color: #0056b3; margin-top: 0;">🎓 FS Shorthand Hub</h2>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Login</div>
            <div class="tab" onclick="switchTab('signup')">Sign Up</div>
        </div>

        <!-- Login Form -->
        <div id="loginForm" class="form-section active">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="apni.email@gmail.com" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <div class="password-container">
                    <input type="password" id="loginPassword" placeholder="********" required>
                    <span class="toggle-password" onclick="togglePassword('loginPassword', this)">Show</span>
                </div>
            </div>

            <button class="btn" onclick="handleLogin()">Login Karein</button>
            <p id="loginError" class="error-msg"></p>
        </div>

        <!-- Sign Up Form -->
        <div id="signupForm" class="form-section">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signupName" placeholder="Aapka Pura Naam" required>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="signupMobile" placeholder="10 digit mobile number" maxlength="10" required>
            </div>

            <div class="form-group">
                <label>Valid Email Address</label>
                <input type="email" id="signupEmail" placeholder="apni.email@gmail.com" required>
            </div>
            
            <div class="form-group">
                <label>Create Password</label>
                <div class="password-container">
                    <input type="password" id="signupPassword" placeholder="Kam se kam 6 anko ka password" required>
                    <span class="toggle-password" onclick="togglePassword('signupPassword', this)">Show</span>
                </div>
            </div>

            <button class="btn" style="background-color: #28a745;" onclick="handleSignup()">Naya Account Banayein</button>
            <p id="signupError" class="error-msg"></p>
            <p id="signupSuccess" class="success-msg"></p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCQRL68rxE5A8sjz0A3H4hVde4lV3ZEI28",
            authDomain: "fs-shorthand-hub.firebaseapp.com",
            projectId: "fs-shorthand-hub",
            storageBucket: "fs-shorthand-hub.firebasestorage.app",
            messagingSenderId: "358638447717",
            appId: "1:358638447717:web:854442a3ad222b9d1caa8c"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.firestore();
        const auth = firebase.auth();

        // Tab Switching Logic
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));

            if(tabName === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('signupForm').classList.add('active');
            }
        }

        // Show / Hide Password Toggle
        function togglePassword(fieldId, el) {
            const input = document.getElementById(fieldId);
            if(input.type === "password") {
                input.type = "text";
                el.innerText = "Hide";
            } else {
                input.type = "password";
                el.innerText = "Show";
            }
        }

        // Valid Email Checker Regex
        function isValidEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        // Handle Signup with Full Name & Mobile
        function handleSignup() {
            const name = document.getElementById('signupName').value.trim();
            const mobile = document.getElementById('signupMobile').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const errEl = document.getElementById('signupError');
            const succEl = document.getElementById('signupSuccess');

            errEl.style.display = 'none';
            succEl.style.display = 'none';

            if(!name || !mobile || !email || !password) {
                errEl.innerText = "Kripya sabhi fields (Name, Mobile, Email, Password) bharein!";
                errEl.style.display = 'block';
                return;
            }

            if(!isValidEmail(email)) {
                errEl.innerText = "Kripya ek valid Email Address dalein!";
                errEl.style.display = 'block';
                return;
            }

            if(mobile.length < 10) {
                errEl.innerText = "Kripya sahi 10-digit mobile number dalein!";
                errEl.style.display = 'block';
                return;
            }

            auth.createUserWithEmailAndPassword(email, password)
            .then((userCredential) => {
                const user = userCredential.user;
                // Firestore mein Extra Details (Name, Mobile) save karein
                return db.collection("users").doc(user.uid).set({
                    fullName: name,
                    mobileNumber: mobile,
                    email: email,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            })
            .then(() => {
                succEl.innerText = "Account safalta-purvak ban gaya! Ab aap Login kar sakte hain.";
                succEl.style.display = 'block';
                setTimeout(() => { switchTab('login'); }, 2000);
            })
            .catch((error) => {
                errEl.innerText = "Error: " + error.message;
                errEl.style.display = 'block';
            });
        }

        // Handle Login
        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errEl = document.getElementById('loginError');

            errEl.style.display = 'none';

            if(!email || !password) {
                errEl.innerText = "Kripya email aur password dalein.";
                errEl.style.display = 'block';
                return;
            }

            if(!isValidEmail(email)) {
                errEl.innerText = "Kripya ek valid Email Address dalein!";
                errEl.style.display = 'block';
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
            .then(() => {
                window.location.replace("practice.html");
            })
            .catch((error) => {
                errEl.innerText = "Login Failed: " + error.message;
                errEl.style.display = 'block';
            });
        }
    </script>
</body>
</html>
