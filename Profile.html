<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FS Shorthand Hub - User Profile & History</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0; }
        .header { background-color: #1e293b; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .header h1 { margin: 0; font-size: 22px; color: #38bdf8; }
        .nav-btn { background-color: #38bdf8; color: #0f172a; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; margin-right: 10px; }
        .logout-btn { background-color: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .container { max-width: 1000px; margin: 30px auto; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 25px; }
        .card h2 { margin-top: 0; color: #38bdf8; font-size: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #94a3b8; font-size: 14px; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        
        .update-btn { background-color: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; margin-top: 10px; }
        .update-btn:hover { background-color: #16a34a; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #334155; padding: 12px; text-align: left; font-size: 14px; }
        th { background-color: #0f172a; color: #38bdf8; }
        td { color: #cbd5e1; }
        .success-msg { color: #22c55e; font-size: 14px; margin-top: 10px; display: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎓 FS Shorthand Hub - Student Profile</h1>
        <div>
            <a href="practice.html" class="nav-btn">⬅ Practice Dashboard</a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        
        <!-- Profile Edit Card -->
        <div class="card">
            <h2>👤 Meri Profile Details</h2>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="profileName" placeholder="Aapka Naam">
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="profileMobile" placeholder="Mobile Number" maxlength="10">
            </div>
            <div class="form-group">
                <label>Email Address (Cannot be changed)</label>
                <input type="email" id="profileEmail" disabled style="background: #1e293b; color: #64748b; cursor: not-allowed;">
            </div>
            <button class="update-btn" onclick="updateProfile()">Profile Update Karein</button>
            <p id="updateSuccess" class="success-msg">✅ Profile safalta-purvak update ho gayi hai!</p>
        </div>

        <!-- Test History & Rank Card -->
        <div class="card">
            <h2>📜 Test History & Performance Record</h2>
            <table>
                <thead>
                    <tr>
                        <th>Dictation Title</th>
                        <th>Total Words</th>
                        <th>Total Errors</th>
                        <th>Error %</th>
                        <th>Date / Time</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <!-- Dynamic History -->
                </tbody>
            </table>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCQRL68rxE5A8sjz0A3H4hVde4lV3ZEI28",
            authDomain: "fs-shorthand-hub.firebaseapp.com",
            projectId: "fs-shorthand-hub",
            storageBucket: "fs-shorthand-hub.firebasestorage.app",
            messagingSenderId: "358638447717",
            appId: "1:358638447717:web:854442a3ad222b9d1caa8c"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();
        let currentUserId = null;

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUserId = user.uid;
                document.getElementById('profileEmail').value = user.email;
                loadUserData(user.uid);
                loadTestHistory();
            } else {
                window.location.replace("login.html");
            }
        });

        function logout() {
            auth.signOut().then(() => { window.location.replace("login.html"); });
        }

        function loadUserData(uid) {
            db.collection("users").doc(uid).get().then((doc) => {
                if (doc.exists) {
                    let data = doc.data();
                    document.getElementById('profileName').value = data.fullName || "";
                    document.getElementById('profileMobile').value = data.mobileNumber || "";
                }
            }).catch((error) => {
                console.log("Error getting user document:", error);
            });
        }

        function updateProfile() {
            if(!currentUserId) return;
            let name = document.getElementById('profileName').value.trim();
            let mobile = document.getElementById('profileMobile').value.trim();

            db.collection("users").doc(currentUserId).update({
                fullName: name,
                mobileNumber: mobile
            }).then(() => {
                let msg = document.getElementById('updateSuccess');
                msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 3000);
            }).catch((error) => {
                alert("Error updating profile: " + error.message);
            });
        }

        function loadTestHistory() {
            let tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = "";
            
            // LocalStorage se history load kar rahe hain (Taaki offline/fast chale)
            let history = JSON.parse(localStorage.getItem("fs_test_history") || "[]");

            if(history.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #64748b;">Abhi tak aapne koi test nahi diya hai.</td></tr>`;
                return;
            }

            history.forEach(h => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${h.title}</b></td>
                    <td>${h.totalWords}</td>
                    <td style="color: #f87171;">${h.totalError}</td>
                    <td style="color: #22c55e; font-weight: bold;">${h.percentage}%</td>
                    <td>${h.date}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
