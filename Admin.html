<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FS Shorthand Hub - Admin Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0; }
        .header { background-color: #1e293b; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .header h1 { margin: 0; font-size: 22px; color: #38bdf8; }
        .logout-btn { background-color: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .container { max-width: 900px; margin: 30px auto; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 30px; }
        .card h2 { margin-top: 0; color: #38bdf8; font-size: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #94a3b8; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        textarea { height: 150px; resize: vertical; }
        
        .add-btn { background-color: #22c55e; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        .add-btn:hover { background-color: #16a34a; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #334155; padding: 12px; text-align: left; font-size: 14px; }
        th { background-color: #0f172a; color: #38bdf8; }
        td { color: #cbd5e1; }
        .delete-btn { background-color: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎓 FS Shorthand Hub - Admin Panel</h1>
        <div>
            <span id="adminEmail" style="margin-right: 15px; font-size: 14px; color: #94a3b8;"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        
        <!-- Add Dictation Card -->
        <div class="card">
            <h2>➕ Nayi Dictation Jodein (Online Firestore)</h2>
            <div class="form-group">
                <label>Dictation Title (e.g., Digital Payment System)</label>
                <input type="text" id="dictTitle" placeholder="Title likhein...">
            </div>
            <div class="form-group">
                <label>Category / Folder</label>
                <select id="dictCategory">
                    <option value="BSF Steno">BSF Steno</option>
                    <option value="AIIMS Steno">AIIMS Steno</option>
                    <option value="UPSSSC Steno">UPSSSC Steno</option>
                    <option value="Legal Matter">Legal Matter</option>
                    <option value="General Matter">General Matter</option>
                </select>
            </div>
            <div class="form-group">
                <label>Audio File Direct URL (GitHub Raw Link)</label>
                <input type="text" id="dictAudioUrl" placeholder="https://raw.githubusercontent.com/.../audio.mp3">
            </div>
            <div class="form-group">
                <label>Time Limit (Minutes)</label>
                <input type="number" id="dictTimeLimit" value="5" min="1" max="30">
            </div>
            <div class="form-group">
                <label>Original Matter (Exact Text for Evaluation)</label>
                <textarea id="dictOriginalText" placeholder="Yahan original matter paste karein..."></textarea>
            </div>
            <button class="add-btn" onclick="addDictationToFirebase()">Dictation Save Karein</button>
        </div>

        <!-- Manage Dictations Card -->
        <div class="card">
            <h2>📁 Sabhi Dictations ki List</h2>
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Time</th>
                        <th>Action</th>
                    </tr>
                Refined:
                </thead>
                <tbody id="adminDictTableBody">
                    <!-- Dynamic List -->
                </tbody>
            </table>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCQRL68rxE5A8sjz0A3H4hVde4lV3ZEI28",
            authDomain: "fs-shorthand-hub.firebaseapp.com",
            projectId: "fs-shorthand-hub",
            storageBucket: "fs-shorthand-hub.firebasestorage.app",
            messagingSenderId: "358638447717",
            appId: "1:358638447717:web:854442a3ad222b9d1caa8c"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('adminEmail').innerText = "Admin: " + user.email;
                loadAdminDictations();
            } else {
                window.location.replace("login.html");
            }
        });

        function logout() {
            auth.signOut().then(() => { window.location.replace("login.html"); });
        }

        function addDictationToFirebase() {
            let title = document.getElementById('dictTitle').value.trim();
            let category = document.getElementById('dictCategory').value;
            let audioUrl = document.getElementById('dictAudioUrl').value.trim();
            let timeLimit = parseInt(document.getElementById('dictTimeLimit').value) || 5;
            let originalText = document.getElementById('dictOriginalText').value.trim();

            if(!title || !audioUrl || !originalText) {
                alert("Kripya sabhi fields bharein!");
                return;
            }

            db.collection("dictations").add({
                title: title,
                category: category,
                audioUrl: audioUrl,
                timeLimit: timeLimit,
                originalText: originalText,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("✅ Dictation safalta-purvak online add ho gayi hai!");
                document.getElementById('dictTitle').value = "";
                document.getElementById('dictAudioUrl').value = "";
                document.getElementById('dictOriginalText').value = "";
                loadAdminDictations();
            }).catch((error) => {
                alert("Error adding dictation: " + error.message);
            });
        }

        function loadAdminDictations() {
            let tbody = document.getElementById('adminDictTableBody');
            tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>Load ho raha hai...</td></tr>";

            db.collection("dictations").orderBy("createdAt", "desc").get().then((querySnapshot) => {
                tbody.innerHTML = "";
                if(querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #64748b;">Koi dictation uplabdh nahi hai.</td></tr>`;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    let d = doc.data();
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><b>${d.title}</b></td>
                        <td>${d.category}</td>
                        <td>${d.timeLimit} Min</td>
                        <td><button class="delete-btn" onclick="deleteDictation('${doc.id}')">Delete</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            }).catch((error) => {
                console.error("Error loading dictations: ", error);
            });
        }

        function deleteDictation(docId) {
            if(confirm("Kya aap is dictation ko delete karna chahte hain?")) {
                db.collection("dictations").doc(docId).delete().then(() => {
                    alert("Dictation delete ho gayi.");
                    loadAdminDictations();
                }).catch((error) => {
                    alert("Error deleting: " + error.message);
                });
            }
        }
    </script>
</body>
</html>
