<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FS Shorthand Hub - Profile & History</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0; }
        .header { background-color: #1e293b; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .header h1 { margin: 0; font-size: 22px; color: #38bdf8; }
        .nav-btn { background-color: #38bdf8; color: #0f172a; border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 14px; }
        
        .container { max-width: 900px; margin: 30px auto; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 10px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card h2 { margin-top: 0; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #334155; padding: 12px; text-align: left; font-size: 14px; }
        th { background-color: #0f172a; color: #38bdf8; }
        td { color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎓 FS Shorthand Hub</h1>
        <a href="practice.html" class="nav-btn">⬅ Back to Practice</a>
    </div>

    <div class="container">
        
        <div class="card">
            <h2>👤 User Profile</h2>
            <p><b>Email:</b> <span id="userEmailProfile" style="color: #38bdf8;">Load ho raha hai...</span></p>
        </div>

        <div class="card">
            <h2>📜 Test History & Performance</h2>
            <table>
                <thead>
                    <tr>
                        <th>Dictation Title</th>
                        <th>Total Words</th>
                        <th>Total Errors</th>
                        <th>Error %</th>
                        <th>Date & Time</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <!-- History will load here -->
                </tbody>
            </table>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCQRL68rxE5A8sjz0A3H4hVde4lV3ZEI28",
            authDomain: "fs-shorthand-hub.firebaseapp.com",
            projectId: "fs-shorthand-hub",
            storageBucket: "fs-shorthand-hub.firebasestorage.app",
            messagingSenderId: "358638447717",
            appId: "1:358638447717:web:854442a3ad222b9d1caa8c"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('userEmailProfile').innerText = user.email;
                loadTestHistory();
            } else {
                window.location.replace("login.html");
            }
        });

        function loadTestHistory() {
            let tbody = document.getElementById('historyTableBody');
            let history = JSON.parse(localStorage.getItem("fs_test_history") || "[]");

            if(history.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #64748b;">Abhi tak koi test nahi diya gaya hai.</td></tr>`;
                return;
            }

            tbody.innerHTML = "";
            history.forEach(item => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${item.title}</b></td>
                    <td>${item.totalWords}</td>
                    <td>${item.totalError}</td>
                    <td><span style="color: #22c55e; font-weight: bold;">${item.percentage}%</span></td>
                    <td>${item.date}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
